name: Android APK Build & Release

# Sadece aşağıdaki 3 satırı istediğiniz gibi değiştirebilirsiniz
env:
  APK_ADI: "FFmpeg-Compressor-Editor.apk"
  SURUM_ETIKETI: "v1.0"
  SURUM_BASLIGI: "FFmpeg Compressor-Editor v1.0"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Indir
        uses: actions/checkout@v6

      - name: Java 21 Kur
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Debug Keystore Olustur
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -keypass android \
                -alias androiddebugkey \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Gradle Surumunu Tespit Et
        id: gradle-ver
        run: |
          VER=""
          if [ -f gradle/wrapper/gradle-wrapper.properties ]; then
            VER=$( (grep -oE 'gradle-[0-9]+(\.[0-9]+)+' gradle/wrapper/gradle-wrapper.properties || true) | head -n1 | sed 's/gradle-//' )
          fi
          echo "version=${VER:-8.11.1}" >> "$GITHUB_OUTPUT"
          echo "Kullanilacak Gradle surumu: ${VER:-8.11.1}"

      - name: Gradle Kur
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ steps.gradle-ver.outputs.version }}
          validate-wrappers: false

      - name: Birim Testleri Calistir
        run: |
          if [ -f "./gradlew" ] && [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            chmod +x ./gradlew
            ./gradlew testDebugUnitTest --stacktrace
          else
            gradle testDebugUnitTest --stacktrace
          fi

      - name: APK Derle (Debug)
        run: |
          if [ -f "./gradlew" ] && [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: APK Dosyasini Yeniden Adlandir
        run: |
          mkdir -p dist
          APK_SRC=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          cp "$APK_SRC" "dist/${{ env.APK_ADI }}"

      - name: APK Dosyasini Actions'a Yukle
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: dist/${{ env.APK_ADI }}

      - name: Indirme Linki Olustur (GitHub Release)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.SURUM_ETIKETI }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.SURUM_BASLIGI }}
          make_latest: "true"
          fail_on_unmatched_files: true
          files: dist/${{ env.APK_ADI }}
