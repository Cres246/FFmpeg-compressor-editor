name: Android APK Build & Release

# Sadece aşağıdaki 3 satırı istediğiniz gibi değiştirebilirsiniz
env:
  APK_ADI: "FFmpeg-Compressor-Editor.apk"
  SURUM_ETIKETI: "v1.0"
  SURUM_BASLIGI: "FFmpeg Compressor-Editor v1.0"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      use_custom_ffmpeg_aar:
        description: "Özel ARM64-O3 SIMD (NEON/DotProd/I8MM) FFmpegKit motorunu kullan"
        type: boolean
        default: true
      rebuild_ffmpeg_aar:
        description: "FFmpegKit ARM64 AAR önbelleğini yoksayıp sıfırdan yeniden derle"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Indir
        uses: actions/checkout@v6

      - name: Java 21 Kur
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Ozel ARM64-O3 SIMD FFmpegKit Onbellegi
        id: ffmpeg-cache
        if: ${{ inputs.use_custom_ffmpeg_aar != false }}
        uses: actions/cache@v4
        with:
          path: |
            app/libs/ffmpeg-kit-custom-arm64-gpl.aar
            app/libs/ffmpeg-kit-custom-arm64-gpl.aar.info.txt
          key: ffmpeg-kit-arm64-simd-v1-${{ hashFiles('scripts/build_optimized_ffmpegkit_arm64.sh', 'scripts/patch_ffmpegkit_arm64_simd.py') }}

      - name: Ozel ARM64-O3 SIMD FFmpegKit AAR Derle (Yedekli)
        id: build-custom-ffmpeg
        if: ${{ inputs.use_custom_ffmpeg_aar != false && github.event_name != 'pull_request' && (steps.ffmpeg-cache.outputs.cache-hit != 'true' || inputs.rebuild_ffmpeg_aar == true) }}
        continue-on-error: true
        timeout-minutes: 45
        run: |
          rm -f app/libs/ffmpeg-kit-custom-arm64-gpl.aar app/libs/ffmpeg-kit-custom-arm64-gpl.aar.info.txt
          chmod +x scripts/build_optimized_ffmpegkit_arm64.sh scripts/patch_ffmpegkit_arm64_simd.py
          if ! bash scripts/build_optimized_ffmpegkit_arm64.sh; then
            echo "::warning::Ozel ARM64-O3 FFmpegKit derlemesi basarisiz oldu; Maven 8.1.9 yedegine donuluyor."
            rm -f app/libs/ffmpeg-kit-custom-arm64-gpl.aar app/libs/ffmpeg-kit-custom-arm64-gpl.aar.info.txt
            exit 1
          fi

      - name: Aktif FFmpeg Motorunu Raporla
        id: engine-info
        run: |
          if [ -f "app/libs/ffmpeg-kit-custom-arm64-gpl.aar" ]; then
            echo "mode=custom" >> "$GITHUB_OUTPUT"
            echo "summary=Ozel ARM64-O3 Runtime SIMD (NEON · DotProd · I8MM)" >> "$GITHUB_OUTPUT"
            echo "Aktif motor: Ozel ARM64-O3 Runtime SIMD FFmpegKit"
            cat app/libs/ffmpeg-kit-custom-arm64-gpl.aar.info.txt 2>/dev/null || true
          else
            echo "mode=maven" >> "$GITHUB_OUTPUT"
            echo "summary=Maven FFmpegKit 8.1.9 (Standart Yedek)" >> "$GITHUB_OUTPUT"
            echo "Aktif motor: Maven dev.ffmpegkit-maintained:ffmpeg-kit-full-gpl:8.1.9"
          fi

      - name: Debug Keystore Olustur
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -keypass android \
                -alias androiddebugkey \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Gradle Surumunu Tespit Et
        id: gradle-ver
        run: |
          VER=""
          if [ -f gradle/wrapper/gradle-wrapper.properties ]; then
            VER=$( (grep -oE 'gradle-[0-9]+(\.[0-9]+)+' gradle/wrapper/gradle-wrapper.properties || true) | head -n1 | sed 's/gradle-//' )
          fi
          echo "version=${VER:-8.11.1}" >> "$GITHUB_OUTPUT"
          echo "Kullanilacak Gradle surumu: ${VER:-8.11.1}"

      - name: Gradle Kur
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ steps.gradle-ver.outputs.version }}
          validate-wrappers: false

      - name: Birim Testleri Calistir
        run: |
          if [ -f "./gradlew" ] && [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            chmod +x ./gradlew
            ./gradlew testDebugUnitTest --stacktrace
          else
            gradle testDebugUnitTest --stacktrace
          fi

      - name: Release Keystore Hazirla
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
        run: |
          if [ ! -f my-upload-key.jks ]; then
            if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
              echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
            else
              keytool -genkeypair -v \
                -keystore my-upload-key.jks \
                -storepass "${STORE_PASSWORD}" \
                -keypass "${KEY_PASSWORD}" \
                -alias upload \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=FFmpeg Release,O=Android,C=US"
            fi
          fi

      - name: APK Derle (Release · R8 Optimize)
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
        run: |
          if [ -f "./gradlew" ] && [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            chmod +x ./gradlew
            ./gradlew assembleRelease --stacktrace
          else
            gradle assembleRelease --stacktrace
          fi

      - name: APK Dosyasini Yeniden Adlandir
        run: |
          mkdir -p dist
          APK_SRC=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$APK_SRC" "dist/${{ env.APK_ADI }}"

      - name: APK Dosyasini Actions'a Yukle
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: dist/${{ env.APK_ADI }}

      - name: Indirme Linki Olustur (GitHub Release)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.SURUM_ETIKETI }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.SURUM_BASLIGI }}
          body: |
            **FFmpeg Motoru:** ${{ steps.engine-info.outputs.summary }}
            **Derleme Tipi:** R8 Optimize Release APK (16 KB ELF uyumlu)
          make_latest: "true"
          fail_on_unmatched_files: true
          files: dist/${{ env.APK_ADI }}
