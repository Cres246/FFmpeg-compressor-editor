name: Android APK Build & Release

# Sadece aşağıdaki 3 satırı istediğiniz gibi değiştirebilirsiniz
env:
  APK_ADI: "FFmpeg-Compressor-Editor.apk"
  SURUM_ETIKETI: "v1.0"
  SURUM_BASLIGI: "FFmpeg Compressor-Editor v1.0"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      rebuild_ffmpeg_aar:
        description: "FFmpegKit Next ARM64 AAR önbelleğini yoksayıp sıfırdan yeniden derle"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Indir
        uses: actions/checkout@v6

      - name: Java 21 Kur
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: FFmpegKit Next ARM64-O3 Onbellegi
        id: ffmpeg-cache
        uses: actions/cache@v5
        with:
          path: |
            app/libs/ffmpeg-kit-custom-arm64-gpl.aar
            app/libs/ffmpeg-kit-custom-arm64-gpl.aar.info.txt
          key: ffmpeg-kit-next-arm64-simd-v4-${{ hashFiles('scripts/build_optimized_ffmpegkit_arm64.sh', 'scripts/patch_ffmpegkit_arm64_simd.py') }}

      - name: Nix Derlemesi Icin Disk Alani Ac
        if: ${{ github.event_name != 'pull_request' && (steps.ffmpeg-cache.outputs.cache-hit != 'true' || inputs.rebuild_ffmpeg_aar == true) }}
        run: |
          echo "Temizlik oncesi disk:"
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          echo "Temizlik sonrasi disk:"
          df -h /

      - name: Determinate Nix Kur
        if: ${{ github.event_name != 'pull_request' && (steps.ffmpeg-cache.outputs.cache-hit != 'true' || inputs.rebuild_ffmpeg_aar == true) }}
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: FFmpegKit Next (FFmpeg 9.0.x · ARM64-O3 SIMD) AAR Derle
        id: build-ffmpeg-next
        if: ${{ github.event_name != 'pull_request' && (steps.ffmpeg-cache.outputs.cache-hit != 'true' || inputs.rebuild_ffmpeg_aar == true) }}
        timeout-minutes: 75
        run: |
          rm -f app/libs/ffmpeg-kit-custom-arm64-gpl.aar app/libs/ffmpeg-kit-custom-arm64-gpl.aar.info.txt
          chmod +x scripts/build_optimized_ffmpegkit_arm64.sh scripts/patch_ffmpegkit_arm64_simd.py
          bash scripts/build_optimized_ffmpegkit_arm64.sh

      - name: Aktif FFmpeg Motorunu Dogrula ve Raporla
        id: engine-info
        run: |
          if [ -f "app/libs/ffmpeg-kit-custom-arm64-gpl.aar" ]; then
            FF_VER="$(grep -E '^detected_ffmpeg_version=' app/libs/ffmpeg-kit-custom-arm64-gpl.aar.info.txt 2>/dev/null | cut -d= -f2 || true)"
            if [ -n "$FF_VER" ] && [ "$FF_VER" != "unknown" ]; then
              SUMMARY="FFmpegKit Next (FFmpeg ${FF_VER} · ARM64-O3 Runtime SIMD)"
            else
              SUMMARY="FFmpegKit Next (FFmpeg 9.0.x · ARM64-O3 Runtime SIMD)"
            fi
            echo "mode=ffmpeg-kit-next" >> "$GITHUB_OUTPUT"
            echo "summary=${SUMMARY}" >> "$GITHUB_OUTPUT"
            echo "Aktif motor: ${SUMMARY}"
            cat app/libs/ffmpeg-kit-custom-arm64-gpl.aar.info.txt 2>/dev/null || true
          else
            if [ "${{ github.event_name }}" != "pull_request" ]; then
              echo "::error::FFmpegKit Next AAR dosyasi bulunamadi! Eski 8.1.9 surumune sessiz donus devre disidir."
              exit 1
            fi
            echo "mode=pr-preview" >> "$GITHUB_OUTPUT"
            echo "summary=PR Onizleme (Maven FFmpegKit)" >> "$GITHUB_OUTPUT"
          fi

      - name: Debug Keystore Olustur
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -keypass android \
                -alias androiddebugkey \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Gradle Surumunu Tespit Et
        id: gradle-ver
        run: |
          VER=""
          if [ -f gradle/wrapper/gradle-wrapper.properties ]; then
            VER=$( (grep -oE 'gradle-[0-9]+(\.[0-9]+)+' gradle/wrapper/gradle-wrapper.properties || true) | head -n1 | sed 's/gradle-//' )
          fi
          echo "version=${VER:-8.11.1}" >> "$GITHUB_OUTPUT"
          echo "Kullanilacak Gradle surumu: ${VER:-8.11.1}"

      - name: Gradle Kur
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ steps.gradle-ver.outputs.version }}
          validate-wrappers: false

      - name: Birim Testleri Calistir
        run: |
          GRADLE_EXTRA_ARGS=""
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            GRADLE_EXTRA_ARGS="-PrequireCustomFfmpeg=true --no-configuration-cache"
          fi
          if [ -f "./gradlew" ] && [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            chmod +x ./gradlew
            ./gradlew testDebugUnitTest ${GRADLE_EXTRA_ARGS} --stacktrace
          else
            gradle testDebugUnitTest ${GRADLE_EXTRA_ARGS} --stacktrace
          fi

      - name: Release Keystore Hazirla
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
        run: |
          if [ ! -f my-upload-key.jks ]; then
            if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
              echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
            else
              keytool -genkeypair -v \
                -keystore my-upload-key.jks \
                -storepass "${STORE_PASSWORD}" \
                -keypass "${KEY_PASSWORD}" \
                -alias upload \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=FFmpeg Release,O=Android,C=US"
            fi
          fi

      - name: APK Derle (Release · R8 Optimize)
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
        run: |
          GRADLE_EXTRA_ARGS=""
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            GRADLE_EXTRA_ARGS="-PrequireCustomFfmpeg=true --no-configuration-cache"
          fi
          if [ -f "./gradlew" ] && [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            chmod +x ./gradlew
            ./gradlew assembleRelease ${GRADLE_EXTRA_ARGS} --stacktrace
          else
            gradle assembleRelease ${GRADLE_EXTRA_ARGS} --stacktrace
          fi

      - name: APK Dosyasini Yeniden Adlandir
        run: |
          mkdir -p dist
          APK_SRC=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$APK_SRC" "dist/${{ env.APK_ADI }}"

      - name: Release APK Motor ve SIMD Dogrulamasi
        if: github.event_name != 'pull_request'
        run: |
          rm -rf /tmp/verify-release-apk
          mkdir -p /tmp/verify-release-apk
          unzip -q "dist/${{ env.APK_ADI }}" -d /tmp/verify-release-apk

          echo "=== APK ABI Klasorleri ==="
          ls -la /tmp/verify-release-apk/lib/
          for bad_abi in armeabi-v7a x86 x86_64; do
            if [ -d "/tmp/verify-release-apk/lib/${bad_abi}" ]; then
              echo "::error::Release APK icine istenmeyen ABI (${bad_abi}) sizmis!"
              exit 1
            fi
          done

          if [ ! -f "/tmp/verify-release-apk/lib/arm64-v8a/libavutil.so" ] || [ ! -f "/tmp/verify-release-apk/lib/arm64-v8a/libavcodec.so" ]; then
            echo "::error::Release APK icinde arm64-v8a FFmpeg kutuphaneleri bulunamadi!"
            exit 1
          fi

          if strings /tmp/verify-release-apk/lib/arm64-v8a/libavutil.so | grep -qE '^n8\.1\.'; then
            echo "::error::KRITIK HATA: Release APK hala eski FFmpegKit 8.1.9 (n8.1.x) kutuphanesini iceriyor!"
            exit 1
          fi

          if ! strings /tmp/verify-release-apk/classes*.dex | grep -qF "FFmpegKit Next"; then
            echo "::error::KRITIK HATA: Release APK BuildConfig icinde 'FFmpegKit Next' bulunamadi!"
            exit 1
          fi

          APK_FF_VER="$(strings /tmp/verify-release-apk/lib/arm64-v8a/libavutil.so | grep -oE '^[0-9]+\.[0-9]+(\.[0-9]+)?(-[A-Za-z0-9._]+)?$' | grep -E '^[7-9]\.|^[1-9][0-9]\.' | head -n 1 || echo unknown)"
          echo "Dogrulandi! Release APK aktif FFmpeg surumu: ${APK_FF_VER}"
          echo "=== APK arm64-v8a Derleyici (.comment) ==="
          readelf -p .comment /tmp/verify-release-apk/lib/arm64-v8a/libavcodec.so 2>/dev/null | grep -i clang | head -n 3 || true
          readelf -p .comment /tmp/verify-release-apk/lib/arm64-v8a/libffmpegkit.so 2>/dev/null | grep -i clang | head -n 3 || true
          echo "=== APK arm64-v8a FFmpeg Configuration ==="
          strings /tmp/verify-release-apk/lib/arm64-v8a/libavutil.so | grep -E '^--' | head -n 1 || true
          echo "=== APK arm64-v8a Derlenmis SIMD Sembolleri ==="
          strings /tmp/verify-release-apk/lib/arm64-v8a/*.so | grep -iE 'DotProd|I8MM|Neon_DotProd|Neon_I8MM|using cpu capabilities' | sort -u | head -n 30 || true
          rm -rf /tmp/verify-release-apk

      - name: APK Dosyasini Actions'a Yukle
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: dist/${{ env.APK_ADI }}

      - name: Indirme Linki Olustur (GitHub Release)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.SURUM_ETIKETI }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.SURUM_BASLIGI }}
          body: |
            **FFmpeg Motoru:** ${{ steps.engine-info.outputs.summary }}
            **Kaynak:** `arthenica/ffmpeg-kit-next` (Tek motor · 16 KB ELF uyumlu)
            **Derleme Tipi:** R8 Optimize Release APK (`arm64-v8a`)
          make_latest: "true"
          fail_on_unmatched_files: true
          files: dist/${{ env.APK_ADI }}
